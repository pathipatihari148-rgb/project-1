<!DOCTYPE html>
<html lang="en">
<head>

    <title>rock paper scissor</title>
    <style>
      body{
        background-color: rgba(25,25,25);
      }
      .move-img{
        height:50px;
        border-radius: 20px;
        color:white;
        font-family: Arial;

      }
      .name{
        font-size: 30px;
        font-weight: 600;
        color:white;
      }
      .move-btn{
        background-color: transparent;
        border: 2px solid white;
        border-radius: 50%;
        width:120px;
        height:120px;
        margin-right: 10px;

      }
      .result{
        font-size: 24px;
        font-weight: 600;
        color:white;
      }
      .moves{
        font-size: 18px;
        color:white;
        
      }
      .score{
        font-size:18px;
        color:white;
      }
      .reset-score-btn{
        padding:8px 15px;
        font-size: 15px;
      }
    </style>
</head>
<body>
    <p class="name">Rock Paper Scissor</p>
    <button class="move-btn" onclick="
    playGame('rock');


    "><img class="move-img" src ="rock-emoji.png"></button>
    <button  class="move-btn" onclick="
    playGame('paper');

    "><img  class="move-img" src="paper-emoji.png"></button>
    <button  class="move-btn" onclick="
    playGame('scissor');
    
    "><img  class="move-img" src="scissor-emoji.png"></button>
    <p class="js-result result"></p>
    <p class="js-moves moves"></p>
    <p class="js-score score"></p>
    

    <button  class="reset-score-btn" onclick="
        score.wins =0;
        score.losses =0;
        score.ties=0;
        localStorage.removeItem('score');
        updatescore()
        ">
       reset score
    </button>
    <script>
        let score = JSON.parse(localStorage.getItem("score"));

        if (score === null){
          score ={
            wins:0,
            losses:0,
            ties:0,
          };
        }

        updatescore();

   

        function playGame(playerMove){
            const computerGuess = pickComputerMove();
            let result= "";
            if (playerMove === "scissor"){
        if (computerGuess==='rock'){
          result = "you lose";
        }
    else if (computerGuess === 'paper')
    {
         result='you win';

    }
    else if (computerGuess ==='scissor')
    {
         result='tie';
    }
    }   
    else if (playerMove === "paper"){
    if (computerGuess === 'rock'){
         result='you win';}
    else if (computerGuess === 'paper')
    {
        result='tie';

    }
    else if (computerGuess ==='scissor')
    {
        result='you lose';
    }
    }
    else if (playerMove === "rock"){
        if (computerGuess=== 'rock'){
            result='tie';
        } else if (computerGuess === 'paper')
    {
        result='you lose';

    }
   else if (computerGuess ==='scissor')
    {
        result='you win';
    }
    
  }   
      if(result === "you win"){
        score.wins +=1;
      }else if(result === "you lose"){
        score.losses +=1;

      }else if(result === "tie"){
        score.ties +=1 ;
      }

      localStorage.setItem("score",JSON.stringify(score))
      
      document.querySelector('.js-result').innerHTML = result;
      document.querySelector('.js-moves').innerHTML = `You <img class="move-img"  src="${playerMove}-emoji.png">
      <img class="move-img" src="${computerGuess}-emoji.png"> computer `;
      updatescore();
    


    
        
    } 
    
     function updatescore(){
      document.querySelector('.js-score').innerHTML = `wins:${score.wins},losses:${score.losses},tie: ${score.ties}`;

     }
      function pickComputerMove(){
        const randomnumber=Math.random();
         let computerGuess= "";
    
    if (randomnumber >=0 && randomnumber<1/3){
     computerGuess='rock';

    }else if (randomnumber >=1/3 && randomnumber<2/3){
      computerGuess='paper';
    }
    else if (randomnumber >=2/3 && randomnumber<1){
      computerGuess='scissor';
    }
      return computerGuess;
      }
    </script>
    
</body>
</html>
